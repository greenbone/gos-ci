version: 2
updates:

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "monthly"
  commit-message:
    prefix: "chore(deps)"
  groups:
    github-actions:
      patterns:
        - "*"
- package-ecosystem: "github-actions"
  directory: ".github/actions"
  schedule:
    interval: "monthly"
  commit-message:
    prefix: "chore(deps)"
  groups:
    github-actions:
      patterns:
        - "*"
